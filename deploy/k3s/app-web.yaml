# crm-web (Next.js, :3000). 브라우저는 같은 주소의 /api/v1 을, 서버(SSR)는 클러스터 내부 crm-api 를 부른다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-web
  namespace: crm
  labels:
    app: crm-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-web
  template:
    metadata:
      labels:
        app: crm-web
    spec:
      imagePullSecrets:
      - name: gitea-registry-auth
      containers:
      - name: web
        image: gitea.delvrio.com/hyungjin7/tnc-crm/web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: CRM_API_BASE_URL
          value: "http://crm-api.crm.svc.cluster.local:3002/api/v1"
        # 사용자·권한 화면이 bbb 계정 목록을 읽는 곳(bbb dcore, apps/accounts/sso.py app_users)
        - name: BBB_CORE_URL
          value: "http://core-service.bbb-namespace.svc.cluster.local:8000"
        - name: CRM_DEPLOYMENT_ENV
          value: production
        - name: TZ
          value: Asia/Seoul
        resources:
          requests:
            memory: "192Mi"
            cpu: "50m"
          limits:
            memory: "768Mi"
            cpu: "1"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: crm-web
  namespace: crm
spec:
  type: ClusterIP
  selector:
    app: crm-web
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
