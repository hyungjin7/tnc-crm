# crm-api (NestJS, :3002). 이미지 태그는 :latest, CI 가 방금 빌드한 :<sha> 로 set image 한다(slp·iii 와 같음).
# 새 버전이 뜨기 전에 initContainer 가 DB 마이그레이션(src/db/migrations/*.sql)을 적용한다(Railway preDeploy 와 같은 역할).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api
  namespace: crm
  labels:
    app: crm-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-api
  template:
    metadata:
      labels:
        app: crm-api
    spec:
      imagePullSecrets:
      - name: gitea-registry-auth
      initContainers:
      - name: migrate
        image: gitea.delvrio.com/hyungjin7/tnc-crm/api:latest
        imagePullPolicy: Always
        command: ["node_modules/.bin/tsx", "scripts/migrate.ts"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: crm-db-secret
              key: DATABASE_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      containers:
      - name: api
        image: gitea.delvrio.com/hyungjin7/tnc-crm/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: crm-db-secret
              key: DATABASE_URL
        - name: DATABASE_POOL_SIZE
          value: "10"
        - name: WEB_ORIGIN
          value: "https://crm.delvrio.com"
        - name: NODE_ENV
          value: production
        - name: TZ
          value: Asia/Seoul
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "1"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: crm-api
  namespace: crm
spec:
  type: ClusterIP
  selector:
    app: crm-api
  ports:
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: http
