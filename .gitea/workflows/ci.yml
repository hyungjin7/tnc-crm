name: tnc-crm CI/CD

# Gitea main push → 바뀐 서비스(api·web)만 이미지로 빌드해 k3s crm 네임스페이스에 배포한다(crm.delvrio.com).
# 구성은 hyungjin7/slp·iii 와 같다(같은 러너·레지스트리·kubeconfig). Railway 배포(.github/workflows/ci.yml, deploy/railway)는 원본 저장소용이라 건드리지 않는다.
#
# 이미지 태그: 매니페스트는 :latest, CI 는 방금 빌드한 :<sha> 로 set image 한다(태그 되커밋 없음).
on:
  push:
    branches:
      - main
  # 수동 실행(Run workflow) 시에는 api·web 을 모두 빌드한다
  workflow_dispatch:

env:
  REGISTRY: "gitea.delvrio.com/hyungjin7/tnc-crm"
  NS: crm

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        run: |
          set -e
          BEFORE="${{ gitea.event.before }}"
          AFTER="${{ gitea.event.after }}"
          if [ -z "$BEFORE" ] || ! git rev-parse --verify -q "${BEFORE}^{commit}" >/dev/null; then
            BEFORE=$(git rev-parse -q --verify "${AFTER:-HEAD}~1" || git hash-object -t tree /dev/null)
          fi
          DIFF=$(git diff --name-only "$BEFORE" "${AFTER:-HEAD}" || true)
          echo "변경 파일:"; echo "$DIFF"
          # 공용(계약·잠금 파일·배포 설정)이 바뀌면 둘 다 빌드한다
          COMMON='^(packages/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|\.dockerignore|deploy/k3s/|\.gitea/)'
          CHANGED=""
          for svc in api web; do
            if [ "${{ gitea.event_name }}" = "workflow_dispatch" ] \
               || echo "$DIFF" | grep -qE "^apps/${svc}/" \
               || echo "$DIFF" | grep -qE "$COMMON"; then
              CHANGED="$CHANGED $svc"
            fi
          done
          echo "services=${CHANGED# }" >> "$GITHUB_OUTPUT"
          echo "빌드 대상: ${CHANGED:-없음}"

      - name: Install kubectl
        run: |
          curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      - name: Apply base manifests
        run: |
          set -e
          K="kubectl --kubeconfig=/root/.kube/config"
          $K apply -f deploy/k3s/00-namespace.yaml
          # 이미지 pull 인증 — 없으면 bbb-namespace 것을 복사한다(같은 레지스트리 계정)
          if ! $K get secret gitea-registry-auth -n $NS >/dev/null 2>&1; then
            $K get secret gitea-registry-auth -n bbb-namespace -o json \
              | jq 'del(.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp,.metadata.managedFields,.metadata.annotations,.metadata.ownerReferences) | .metadata.namespace="'$NS'"' \
              | $K apply -f -
          fi
          if ! $K get secret crm-db-secret -n $NS >/dev/null 2>&1; then
            echo "::warning::crm-db-secret 이 없습니다 — deploy/k3s/README.md 대로 만들어야 crm-api 가 뜹니다"
          fi
          if ! $K get secret crm-basicauth -n $NS >/dev/null 2>&1; then
            echo "::warning::crm-basicauth 가 없습니다 — 만들기 전까지 crm.delvrio.com 이 404 입니다(deploy/k3s/README.md)"
          fi
          $K apply -f deploy/k3s/middleware.yaml
          $K apply -f deploy/k3s/ingress.yaml

      - name: Build, push and deploy
        if: steps.detect.outputs.services != ''
        run: |
          set -e
          K="kubectl --kubeconfig=/root/.kube/config"
          for svc in ${{ steps.detect.outputs.services }}; do
            echo "🚀 $svc"
            # 호스트 도커 인증 상속(bbb CI 와 같음) — provenance/sbom 끄고 단일 아키텍처 push. 컨텍스트는 저장소 루트(pnpm 워크스페이스)
            docker buildx build --provenance=false --sbom=false -f deploy/k3s/$svc.Dockerfile \
              -t ${{ env.REGISTRY }}/$svc:${{ gitea.sha }} -t ${{ env.REGISTRY }}/$svc:latest --push .
            # 매니페스트(probe·리소스)를 적용한 뒤 방금 빌드한 태그로 고정한다(api 는 initContainer 마이그레이션도 같은 태그)
            $K apply -f deploy/k3s/app-$svc.yaml
            $K set image deployment/crm-$svc *=${{ env.REGISTRY }}/$svc:${{ gitea.sha }} -n $NS
          done
          for svc in ${{ steps.detect.outputs.services }}; do
            $K rollout status deployment/crm-$svc -n $NS --timeout=300s || echo "::warning::crm-$svc rollout 대기 시간 초과"
          done
